openapi: 3.0.3
info:
  title: Kawa Network API
  version: 1.0.0
  description: Delivery-tracking API for the Kawa Network washing station pilot at
    Nyaruguru.
paths:
  /api/deliveries/:
    get:
      operationId: deliveries_list
      description: |-
        Delivery recording, and the station-facing delivery feed.
        Deliveries are accepted regardless of the plot's risk_status -
        see ADR.md for the reasoning (Emmanuel cannot hold a farmer at
        the scale waiting on a registry check).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - deliveries
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeliveryList'
          description: ''
    post:
      operationId: deliveries_create
      description: |-
        Delivery recording, and the station-facing delivery feed.
        Deliveries are accepted regardless of the plot's risk_status -
        see ADR.md for the reasoning (Emmanuel cannot hold a farmer at
        the scale waiting on a registry check).
      tags:
      - deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Delivery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Delivery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Delivery'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
          description: ''
