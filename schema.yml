components:
  schemas:
    Delivery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plot:
          type: integer
        plot_sector:
          type: string
          readOnly: true
        plot_washing_station:
          type: string
          readOnly: true
        plot_risk_status:
          type: string
          readOnly: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - plot
      - plot_risk_status
      - plot_sector
      - plot_washing_station
      - recorded_at
      - weight_kg
    Farmer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        registered_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name
      - phone_number
      - registered_at
    PaginatedDeliveryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
    PatchedDelivery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plot:
          type: integer
        plot_sector:
          type: string
          readOnly: true
        plot_washing_station:
          type: string
          readOnly: true
        plot_risk_status:
          type: string
          readOnly: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
          readOnly: true
    PatchedFarmer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        registered_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPlot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farmer:
          type: integer
        sector:
          type: integer
        sector_name:
          type: string
          readOnly: true
        washing_station:
          type: integer
        washing_station_name:
          type: string
          readOnly: true
        risk_status:
          allOf:
          - $ref: '#/components/schemas/RiskStatusEnum'
          readOnly: true
        risk_checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        registered_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSector:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
    PatchedWashingStation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 200
    Plot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farmer:
          type: integer
        sector:
          type: integer
        sector_name:
          type: string
          readOnly: true
        washing_station:
          type: integer
        washing_station_name:
          type: string
          readOnly: true
        risk_status:
          allOf:
          - $ref: '#/components/schemas/RiskStatusEnum'
          readOnly: true
        risk_checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        registered_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - farmer
      - id
      - registered_at
      - risk_checked_at
      - risk_status
      - sector
      - sector_name
      - washing_station
      - washing_station_name
    PriceSchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        season_label:
          type: string
          maxLength: 50
        price_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        effective_from:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
      required:
      - effective_from
      - id
      - price_per_kg
      - season_label
    RiskStatusEnum:
      enum:
      - pending
      - cleared
      - flagged
      type: string
      description: |-
        * `pending` - Pending
        * `cleared` - Cleared
        * `flagged` - Flagged
    Sector:
      type: object
      properties:
